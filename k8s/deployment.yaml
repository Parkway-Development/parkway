apiVersion: apps/v1
kind: Deployment
metadata:
  name: parkway-api
  labels:
    app: parkway-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parkway-api
  template:
    metadata:
      labels:
        app: parkway-api
    spec:
      containers:
      - name: parkway-api
        image: ghcr.io/<your-gh-username>/parkway-api:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
