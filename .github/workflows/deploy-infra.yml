name: Deploy Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    env:
        ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
        ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
        ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
        ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        ARM_CLIENT_OBJECT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientObjectId }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Pulumi
        uses: pulumi/actions@v4

      - name: Login to Pulumi
        run: pulumi login
        working-directory: ./pulumi

      - name: Select dev stack
        run: pulumi stack select parkway-org/parkway/parkway-dev
        working-directory: ./pulumi

      - name: Deploy dev infrastructure
        run: pulumi up --yes
        working-directory: ./pulumi

  request-prod-approval:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Notify Teams for approval
        run: |
          curl -X POST ${{ secrets.TEAMS_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{
                  "text": "⚠️ Approval required: A deployment to *production* is ready. Please approve via GitHub Actions."
                }'

  deploy-prod:
    needs: request-prod-approval
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portal.azure.com/
    env:
        ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
        ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
        ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
        ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        ARM_CLIENT_OBJECT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientObjectId }}
    steps:
      - name: Wait for manual approval
        uses: hmarr/auto-approve-action@v2.1.0

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Pulumi
        uses: pulumi/actions@v4

      - name: Login to Pulumi
        run: pulumi login
        working-directory: ./
