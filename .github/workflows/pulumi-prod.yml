env:
  PULUMI_STACK: parkway-prod

name: Pulumi Deploy (Prod)

on:
  push:
    branches:
      - main

jobs:
  up:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v4

      - name: Login to Pulumi
        run: pulumi login --cloud-url "file://~/.pulumi-local"

      - name: Select stack
        run: pulumi stack select $PULUMI_STACK

      - name: Set config
        run: |
          pulumi config set location centralus --stack $PULUMI_STACK
          pulumi config set resourcePrefix parkway-prod --stack $PULUMI_STACK
          pulumi config set sqlAdminUsername sqladmin --stack $PULUMI_STACK
          pulumi config set sqlAdminPassword ${{ secrets.SQL_ADMIN_PASSWORD_PROD }} --secret --stack $PULUMI_STACK

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build

      - name: Deploy with Pulumi
        id: pulumi-up
        run: |
          pulumi up --yes --stack $PULUMI_STACK || echo "DEPLOY_FAILED=true" >> $GITHUB_ENV

      - name: Rollback if Pulumi up failed
        if: env.DEPLOY_FAILED == 'true'
        run: pulumi destroy --yes --stack $PULUMI_STACK

      - name: Notify Teams of Production Deployment Request
        run: |
          curl -X POST https://prod-135.westus.logic.azure.com:443/workflows/a65f5fe1958547799208e138a32d35af/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Re0icLwKtZPWGQoMueYSdQnMtGCux3fOmaVDon0MygM \
            -H "Content-Type: application/json" \
            -d '{
                  "text": "🚀 A deployment to *production* has been requested. Please approve in GitHub."
                }'



        