name: Pulumi Deploy (Prod)

on:
  push:
    branches:
      - main

env:
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_CLIENT_OBJECT_ID: ${{ secrets.ARM_CLIENT_OBJECT_ID }}
  PULUMI_STACK: parkway-org/parkway/parkway-prod

jobs:
  up:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v4

      - name: Login to Pulumi
        run: pulumi login

      - name: Select stack
        run: pulumi stack select $PULUMI_STACK

      - name: Set config
        run: |
          pulumi config set location centralus --stack $PULUMI_STACK
          pulumi config set resourcePrefix parkway-prod --stack $PULUMI_STACK
          pulumi config set sqlAdminUsername sqladmin --stack $PULUMI_STACK
          pulumi config set sqlAdminPassword ${{ secrets.SQL_ADMIN_PASSWORD_PROD }} --secret --stack $PULUMI_STACK
          pulumi config set parkway:tenantId ${{ env.ARM_TENANT_ID }} --stack parkway-prod

      - name: Install dependencies
        run: dotnet restore

      - name: Build Pulumi project
        run: dotnet build

      - name: Deploy infrastructure
        run: pulumi up --yes
